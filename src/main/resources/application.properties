# Aktywacja profilu dev
spring.profiles.active=dev

# Base64-encoded random secret (at least 32 bytes); never commit the actual value.
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# Konfiguracja polaczenia do bazyu danych
spring.datasource.url=jdbc:postgresql://localhost:5432/pgDB
spring.datasource.username=user
spring.datasource.password=password

# Konfiguracja JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.inventory.demo-enabled=${DEMO_INVENTORY_ENABLED:false}
app.inventory.interval-ms=${DEMO_INVENTORY_INTERVAL_MS:60000}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Konfiguracja error serwera
server.error.path=/myError
server.error.whitelabel.enabled=false

#Swagger
springdoc.packagesToScan=com.example.projektsklep.controller


# http://localhost:8080/swagger-ui/index.html


